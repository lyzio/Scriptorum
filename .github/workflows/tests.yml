# The automated tests on GitHub (design document section 10, M6-0.6.10,
# decided 18 November 2026).
#
# Every pull request and every push to a build branch runs the whole test
# suite on Linux, with the pinned versions from pyproject.toml, the window
# tests headless. Branch protection for main (switched on by the project
# manager in the repository's settings) can then require this check to pass
# before a pull request is merged. The job may only read the repository.
name: Tests

on:
  pull_request:
  push:
    branches: ["build/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
    steps:
      - name: The repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Node.js 22 (the interface's TypeScript checks)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: The libraries Qt needs on Linux
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libnss3 libnspr4 libxkbfile1
          libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libxi6 libxfixes3
          libgl1 libegl1 libgbm1 libasound2t64 libfontconfig1 libdbus-1-3

      - name: The pinned Python packages and the test tools
        run: python -m pip install -e ".[test]"

      - name: The interface's build tools
        working-directory: ui-src
        run: npm ci

      - name: Run the tests
        run: python -m pytest -q
